name: Dirty Birds Fast Sleeper Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: dirty-birds-fast-sleeper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh lightweight read-only Sleeper feed
        env:
          SLEEPER_LEAGUE_ID: '1399157532559192064'
        run: python fast_sync.py
      - name: Publish fast data
        run: |
          git config user.name "Dirty Birds Data Bot"
          git config user.email "dirty-birds-data-bot@users.noreply.github.com"
          git add data/fast_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh fast Sleeper snapshot"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
