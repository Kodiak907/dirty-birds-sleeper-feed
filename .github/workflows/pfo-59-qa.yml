name: PFO 5.9 isolated regression QA
on:
  push:
    branches:
      - pfo-59-commissioner-ui-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PFO JS, Commissioner, 100k Championship, owner-specific research tests
        run: node --test pfo-thursday/qa-59.test.mjs
      - name: PFO 5.9.6 roster news, trade, injury, matchup and playoff UI regression
        run: node --test pfo-thursday/qa-596.test.mjs
      - name: FFO-owned rules and MySportsFeeds-only independent scoring regression
        run: node --test pfo-thursday/qa-ffo-msf.test.mjs
      - name: Install isolated Chromium smoke test dependencies
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: PFO mobile-browser navigation and Commissioner isolation smoke
        run: node --test pfo-thursday/qa-59-browser.test.mjs
