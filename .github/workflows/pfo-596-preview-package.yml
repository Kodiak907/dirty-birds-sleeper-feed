name: PFO 5.9.6 protected preview build package
on:
  push:
    branches:
      - pfo-59-commissioner-ui-20261028
    paths:
      - 'pfo-thursday/**'
      - '.github/workflows/pfo-596-preview-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm immutable 5.9.6 asset set
        run: |
          test -f pfo-thursday/index.html
          test -f pfo-thursday/_worker.js
          test -f pfo-thursday/ffo-pfo-596.js
          test -f pfo-thursday/ffo-pfo-596.css
          grep -q '5.9.6 COACH REVIEW' pfo-thursday/index.html
          node --check pfo-thursday/ffo-pfo-core.js
          node --check pfo-thursday/ffo-pfo-59.js
          node --check pfo-thursday/ffo-pfo-596.js
      - name: Package only deployment assets (no repo data or CI files)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          find pfo-thursday -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.mjs' -o -name '*.json' \) -exec cp {} "$RUNNER_TEMP/site/" \;
          (cd "$RUNNER_TEMP/site" && zip -q -r "$GITHUB_WORKSPACE/pfo-596-preview.zip" .)
          unzip -l pfo-596-preview.zip
      - name: Upload immutable preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pfo-596-preview-site
          path: pfo-596-preview.zip
          if-no-files-found: error
          retention-days: 7
