name: PFO 5.9.8 deploy Access-protected Preview (never production)
on:
  push:
    branches:
      - pfo-598-msf-core-and-mobile-20261029
    paths:
      - '.github/workflows/pfo-598-preview-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/pfo-598-msf-core-and-mobile-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfo-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and regression suite
        run: |
          node --test pfo-thursday/qa-598.test.mjs pfo-thursday/qa-ffo-msf.test.mjs pfo-thursday/qa-597.test.mjs pfo-thursday/qa-596.test.mjs
          cp pfo-thursday/_worker.js /tmp/ffo-worker.mjs
          node --check /tmp/ffo-worker.mjs
      - name: Assemble safe root-level Pages Preview files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pfo-preview"
          find pfo-thursday -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.mjs' -o -name '*.json' \) ! -name 'qa-*' -exec cp {} "$RUNNER_TEMP/pfo-preview/" \;
          test -s "$RUNNER_TEMP/pfo-preview/index.html"
          test -s "$RUNNER_TEMP/pfo-preview/_worker.js"
          test -s "$RUNNER_TEMP/pfo-preview/FFO_FFL_SCORING_V1.json"
      - name: Verify deploy-only credentials available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub Actions needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository or environment secrets; preview NOT deployed"
            exit 1
          fi
      - name: Deploy ONLY the existing Cloudflare Pages Preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.47.0 pages deploy "$RUNNER_TEMP/pfo-preview" --project-name dirtybirdstest --branch pfo-598-msf-core-and-mobile-20261029 --commit-hash "$GITHUB_SHA" --commit-message "PFO 5.9.8 MSF preview only"
          echo "Deployment targeted preview branch only. Confirm Access challenge and data before any green light."
