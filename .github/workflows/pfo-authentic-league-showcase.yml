name: PFO Authentic League Showcase - real PFO interface
on:
  push:
    branches: [pfo-authentic-league-view-20261104]
    paths:
      - 'pfo-league-showcase/**'
      - '.github/workflows/pfo-authentic-league-showcase.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pfo-authentic-league-showcase
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual PFO research engine and showcase JS
        run: |
          node --check pfo-league-showcase/showcase.js
          node --check pfo-thursday/ffo-trade-decision-60.mjs
          node --check pfo-thursday/ffo-market-finder-61.mjs
          node --test pfo-league-showcase/qa-showcase.test.mjs
      - name: Install isolated mobile browser test dependencies
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test exact original PFO interface with realistic sample players on mobile
        run: node --test pfo-league-showcase/qa-showcase-browser.test.mjs
  deploy:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pfo-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare demo deployment secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5cc05345c4f2bc274e5db46f647b2900'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Assemble authentic public PFO showroom (no Worker, secrets or private data)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pfo-league-showcase"
          cp pfo-league-showcase/index.html pfo-league-showcase/showcase.js pfo-league-showcase/showcase.css pfo-league-showcase/sample-rosters.json "$RUNNER_TEMP/pfo-league-showcase/"
          cp pfo-thursday/ffo-pfo-core.css pfo-thursday/ffo-pfo-59.css pfo-thursday/ffo-mobile-594.css pfo-thursday/ffo-pfo-596.css pfo-thursday/ffo-pfo-597.css pfo-thursday/ffo-layout-64.css "$RUNNER_TEMP/pfo-league-showcase/"
          cp pfo-thursday/ffo-trade-decision-60.mjs pfo-thursday/ffo-market-finder-61.mjs "$RUNNER_TEMP/pfo-league-showcase/"
          test "$(find "$RUNNER_TEMP/pfo-league-showcase" -maxdepth 1 -type f | wc -l)" -eq 12
          ! find "$RUNNER_TEMP/pfo-league-showcase" -maxdepth 1 -type f -name '_worker.js' | grep .
          ! grep -E '1399157532559192064|/api/commissioner|MSF_API_KEY|dirtybirdstest' "$RUNNER_TEMP/pfo-league-showcase/"*.js "$RUNNER_TEMP/pfo-league-showcase/"*.json "$RUNNER_TEMP/pfo-league-showcase/"*.html
          echo "Original PFO CSS and PFO pure decision engines packaged. No real roster or private Worker."
      - name: Replace the incorrect public fantasy simulator with the actual PFO league showcase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5cc05345c4f2bc274e5db46f647b2900'
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.47.0 pages deploy "$RUNNER_TEMP/pfo-league-showcase" --project-name ffo-league-demo --branch pfo-league-demo-20261104 --commit-hash "$GITHUB_SHA" --commit-message "Actual PFO UI with real-NFL demo franchise and read-only FFO engines"
          echo "Separate public demo only. Private PFO Preview, production and Commissioner records unchanged."
