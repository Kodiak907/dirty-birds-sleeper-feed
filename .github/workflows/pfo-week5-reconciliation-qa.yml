name: PFO Week 5 isolated MSF reconciliation QA
on:
  push:
    branches:
      - pfo-msf-week5-reconciliation-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msf-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Week 5 MSF source event reconciliation
        run: node --test pfo-thursday/qa-msf-week5-reconciliation.test.mjs
      - name: MSF verified historical form and projections
        run: node --test pfo-thursday/qa-msf-verified-projections.test.mjs
      - name: League-wide historical matchup coverage QA
        run: node --test pfo-thursday/qa-msf-historical-matchups.test.mjs
      - name: Existing independent MSF scoring regressions
        run: node --test pfo-thursday/qa-ffo-msf.test.mjs
