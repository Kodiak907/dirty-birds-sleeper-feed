name: Pregame Inactive Window Check
on:
  push:
    paths:
      - 'gameday_window_check.py'
      - 'gameday_alerts.py'
      - 'test_phase_vii.py'
      - '.github/workflows/pregame-window.yml'
  workflow_dispatch:
  schedule:
    # GitHub scheduled jobs are UTC and can be delayed. Quarter-hour
    # polling plus the 45–75 min before actual kickoff gate handles DST
    # and Thursday/Sunday/Monday early, afternoon and night starts.
    - cron: '0,15,30,45 * * * *'
permissions:
  contents: write
concurrency:
  group: sleeper-sync
  cancel-in-progress: false
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate kickoff time and check inactives conditionally
        env:
          SLEEPER_LEAGUE_ID: '1399157532559192064'
        run: |
          python -m unittest -v test_phase_vii
          python gameday_window_check.py
          python gameday_alerts.py
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('data/GAMEDAY_ALERTS.json')
          if p.exists():
              d=json.loads(p.read_text())
              lines=['## Dirty Birds pregame review',f"Week {d.get('week')} — {d.get('alert_count',0)} review alerts"]
              for a in d.get('alerts',[]):
                  lines.append(f"- {a.get('severity','review').upper()}: {a.get('player','Source')} — {a.get('message')}")
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('\\n'.join(lines)+'\\n')
          PY
      - name: Publish changed gameday reports if any
        run: |
          git config user.name "Dirty Birds Data Bot"
          git config user.email "dirty-birds-data-bot@users.noreply.github.com"
          git add data/GAMEDAY_ALERTS.json data/GAMEDAY_ALERTS.md data/GAMEDAY_WINDOW_CHECK.json data/GAME_INACTIVES_EVIDENCE.json data/OFFICIAL_INACTIVE_VERIFICATION.json data/GAMEDAY_DECISION.json data/GAMEDAY_DECISION.md data/latest.json data/player_names.json data/player_metadata.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Pregame read-only availability window check"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
