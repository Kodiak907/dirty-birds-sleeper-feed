name: Refresh Trade Projections

on:
  push:
    paths:
      - 'fetch_projections.py'
      - '.github/workflows/projections-refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 */6 * * *'

permissions:
  contents: write

concurrency:
  group: projections-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch sourced future Sleeper player projections
        env:
          SLEEPER_SEASON: '2026'
        run: python fetch_projections.py
      - name: Smoke-test requested Kyren-for-Bowers hypothetical (no trade action)
        run: python trade_simulator.py --give 'Kyren Williams' --receive 'Brock Bowers' --projections data/ros_projections.json
      - name: Commit sourced data only after validated fetch
        run: |
          git config user.name "Dirty Birds Data Bot"
          git config user.email "dirty-birds-data-bot@users.noreply.github.com"
          git add data/ros_projections.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sourced rest-of-season projections"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
