
name: Sleeper Read-Only Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: sleeper-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch league data and calculate changes
        env:
          SLEEPER_LEAGUE_ID: '1399157532559192064'
        run: |
            python update.py
            python radar.py
            python scouting.py
            python valuation.py
            python waiver.py

      - name: Commit changed data
        run: |
          git config user.name "Dirty Birds Data Bot"
          git config user.email "dirty-birds-data-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Sleeper read-only sync"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
