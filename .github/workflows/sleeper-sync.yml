
name: Sleeper Read-Only Sync

on:
  push:
    paths:
      - 'fetch_usage.py'
      - 'waiver.py'
      - 'auto_waiver_scout.py'
      - 'trade_quality_43.py'
      - 'trade_block_scout.py'
      - 'fetch_market_values.py'
      - 'fetch_projections.py'
      - 'decision_engine.py'
      - 'lineup_impact.py'
      - 'actionable_gm_board.py'
      - 'weekly_lineups.py'
      - 'pregame_calibration.py'
      - 'decision_backtest.py'
      - 'fetch_opportunity.py'
      - 'availability_intelligence.py'
      - 'gameday_decision.py'
      - 'fetch_game_inactives.py'
      - 'verify_official_inactives.py'
      - 'fetch_schedule.py'
      - 'trade_simulator.py'
      - '.github/workflows/sleeper-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
    # Sunday NFL gameday: one additional refresh between hourly runs.
    # UTC: Sunday daytime plus Sunday afternoon/evening in US Pacific.
    - cron: '37 15-23 * * 0'
    - cron: '37 0-5 * * 1'

permissions:
  contents: write

concurrency:
  group: sleeper-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch league data and calculate changes
        env:
          SLEEPER_LEAGUE_ID: '1399157532559192064'
        run: |
            python update.py
            python fetch_usage.py
            python fetch_opportunity.py
            python fetch_schedule.py
            python radar.py
            python scouting.py
            python valuation.py
            python waiver.py
            python decision_engine.py
            python lineup_impact.py
            python actionable_gm_board.py
            # Refresh independent trade inputs only when aged, not on every hourly run.
            python - <<'PY'
            import datetime as dt, json, subprocess
            from pathlib import Path
            now=dt.datetime.now(dt.timezone.utc)
            for file,program in [('market_values.json','fetch_market_values.py'),('ros_projections.json','fetch_projections.py')]:
                try:
                    x=json.loads((Path('data')/file).read_text())
                    age=(now-dt.datetime.fromisoformat(str(x.get('as_of','')).replace('Z','+00:00'))).total_seconds()/3600
                except Exception: age=999
                if age>=12:
                    result=subprocess.run(['python',program],check=False)
                    if result.returncode:print('WARNING: failed refreshing '+file+'; current old source is retained')
            PY
            # Automated candidate-wide injury/role/news research and stronger 1:1/2:2 trade gates.
            python auto_waiver_scout.py
            python trade_quality_43.py
            python trade_block_scout.py

            python weekly_lineups.py
            python pregame_calibration.py
            python decision_backtest.py
            python availability_intelligence.py
            python fetch_game_inactives.py
            python verify_official_inactives.py
            python gameday_decision.py

      - name: Commit changed data
        run: |
          git config user.name "Dirty Birds Data Bot"
          git config user.email "dirty-birds-data-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Sleeper read-only sync"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
