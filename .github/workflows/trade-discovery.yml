name: Discover Dirty Birds Trades
on:
  push:
    paths:
      - 'trade_discovery.py'
      - '.github/workflows/trade-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trade-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze bilateral lineup trade ideas
        run: python trade_discovery.py
      - name: Publish only read-only research files
        run: |
          git config user.name "Dirty Birds Data Bot"
          git config user.email "dirty-birds-data-bot@users.noreply.github.com"
          git add data/TRADE_IDEAS.json data/TRADE_IDEAS.md
          if ! git diff --cached --quiet; then
            git commit -m "Update read-only two-sided trade discovery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
